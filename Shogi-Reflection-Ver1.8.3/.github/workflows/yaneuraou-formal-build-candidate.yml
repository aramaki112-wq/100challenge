name: YaneuraOu Formal Build Profile Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yaneuraou-formal-build-candidate.yml"
      - "Shogi-Reflection-Ver1.8.3/.github/workflows/yaneuraou-formal-build-candidate.yml"
      - "Shogi-Reflection-Ver1.8.3/formal-build-gate/**"

permissions:
  contents: read

env:
  APP_DIR: Shogi-Reflection-Ver1.8.3
  YANEURAOU_REPOSITORY: https://github.com/yaneurao/YaneuraOu.git
  YANEURAOU_COMMIT: a5ee2786c0030edc7d4a1cdfe94b04dffec55493
  EMSCRIPTEN_IMAGE: emscripten/emsdk:3.1.43

jobs:
  formal-build-profile:
    name: Non-diagnostic build and all Real gates
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact Shogi Reflection source
        uses: actions/checkout@v4.2.2

      - name: Record Source of Truth and run unchanged regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR/formal-build-gate/evidence"
          git rev-parse HEAD | tee "$APP_DIR/formal-build-gate/evidence/shogi-reflection-commit.txt"
          git rev-parse "HEAD:$APP_DIR" | tee "$APP_DIR/formal-build-gate/evidence/shogi-reflection-tree.txt"
          find "$APP_DIR" -type f | sort | wc -l | tee "$APP_DIR/formal-build-gate/evidence/baseline-file-count.txt"
          date -u +"%Y-%m-%dT%H:%M:%SZ"             | tee "$APP_DIR/formal-build-gate/evidence/build-date-utc.txt"
          {
            printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-UNKNOWN}"
            printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-UNKNOWN}"
            printf 'ImageOS=%s\n' "${ImageOS:-UNKNOWN}"
            printf 'ImageVersion=%s\n' "${ImageVersion:-UNKNOWN}"
            printf 'GITHUB_ACTIONS=%s\n' "${GITHUB_ACTIONS:-UNKNOWN}"
          } | tee "$APP_DIR/formal-build-gate/evidence/runner-environment.txt"
          chmod +x "$APP_DIR/formal-build-gate/build-formal-yaneuraou-wasm.sh"
          chmod +x "$APP_DIR/formal-build-gate/prepare-formal-runtime.sh"
          chmod +x "$APP_DIR/adapter-real-gate/prepare-runtime.sh"
          chmod +x "$APP_DIR/sample-fullply-real-gate/prepare-runtime.sh"
          bash -n "$APP_DIR/formal-build-gate/build-formal-yaneuraou-wasm.sh"
          bash -n "$APP_DIR/formal-build-gate/prepare-formal-runtime.sh"
          python3 -m py_compile "$APP_DIR/formal-build-gate/run30_formal_candidate_verify.py"
          python3 -m py_compile "$APP_DIR/minimal-real-usi/minimal_browser_search_probe.py"
          python3 -m py_compile "$APP_DIR/minimal-real-usi/minimal_browser_runtime_probe.py"
          python3 -m py_compile "$APP_DIR/adapter-real-gate/real_adapter_gate_verify.py"
          python3 -m py_compile "$APP_DIR/sample-fullply-real-gate/real_sample_fullply_verify.py"
          python3 -m py_compile "$APP_DIR/real-reflection-flow-gate/real_reflection_flow_verify.py"
          python3 -m py_compile "$APP_DIR/real-cancel-reanalysis-gate/real_cancel_reanalysis_verify.py"
          cd "$APP_DIR"
          npm test 2>&1 | tee formal-build-gate/evidence/npm-test.log
          node verify.mjs 2>&1 | tee formal-build-gate/evidence/static-verification.log

      - name: Pull and record pinned Emscripten image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$EMSCRIPTEN_IMAGE"
          docker image inspect "$EMSCRIPTEN_IMAGE" --format '{{.Id}}' \
            | tee "$APP_DIR/formal-build-gate/evidence/emscripten-image-id.txt"
          docker image inspect "$EMSCRIPTEN_IMAGE" --format '{{json .RepoDigests}}' \
            | tee "$APP_DIR/formal-build-gate/evidence/emscripten-image-repodigests.json"

      - name: Clone and verify official pinned YaneuraOu
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/YaneuraOu-run30-formal"
          git clone "$YANEURAOU_REPOSITORY" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$YANEURAOU_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$YANEURAOU_COMMIT"
          test -z "$(git -C "$SOURCE_DIR" status --porcelain=v1)"
          echo "YANEURAOU_RUN30_SOURCE=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Build non-diagnostic Formal Build Profile candidate
        shell: bash
        run: |
          set -euo pipefail
          "$APP_DIR/formal-build-gate/build-formal-yaneuraou-wasm.sh" \
            "$YANEURAOU_RUN30_SOURCE" \
            "$GITHUB_WORKSPACE/$APP_DIR"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Shogi-Reflection-Ver1.8.3/formal-build-gate/FORMAL_BUILD_METADATA.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['diagnosticBuild'] is False
          assert d['diagnosticFlags'] is None
          assert d['formalBuildCandidate'] is True
          assert d['wasmUsiCommandExport'] is True
          print('PASS: diagnostic flags are absent from the fresh Run #30 build.')
          PY

      - name: Install pinned browser verifier once
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r "$APP_DIR/requirements-real-engine.txt"
          python3 -m playwright install --with-deps chromium

      - name: Run Minimal Search on exact Run30 hashes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR/minimal-real-usi"
          rm -f MINIMAL_NODE_SEARCH_RESULT.json MINIMAL_BROWSER_SEARCH_RESULT.json
          node minimal_node_search_probe.cjs 2>&1 | tee ../formal-build-gate/evidence/minimal-node-search.log
          python3 minimal_browser_search_probe.py 2>&1 | tee ../formal-build-gate/evidence/minimal-browser-search.log

      - name: Run Minimal Runtime MultiPV stop reanalysis mate quit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR/minimal-real-usi"
          rm -f MINIMAL_NODE_RUNTIME_RESULT.json MINIMAL_BROWSER_RUNTIME_RESULT.json
          node minimal_node_runtime_probe.cjs 2>&1 | tee ../formal-build-gate/evidence/minimal-node-runtime.log
          python3 minimal_browser_runtime_probe.py 2>&1 | tee ../formal-build-gate/evidence/minimal-browser-runtime.log

      - name: Run production Adapter gate on exact Run30 hashes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          "$APP_DIR/adapter-real-gate/prepare-runtime.sh" "$GITHUB_WORKSPACE/$APP_DIR"
          cd "$APP_DIR"
          rm -f adapter-real-gate/REAL_ADAPTER_INTEGRATION_RESULT.json
          python3 adapter-real-gate/real_adapter_gate_verify.py 2>&1 \
            | tee formal-build-gate/evidence/adapter.log

      - name: Run Sample KIF full-ply gate on exact Run30 hashes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          "$APP_DIR/sample-fullply-real-gate/prepare-runtime.sh" "$GITHUB_WORKSPACE/$APP_DIR"
          cd "$APP_DIR"
          rm -f sample-fullply-real-gate/REAL_SAMPLE_FULLPLY_RESULT.json
          python3 sample-fullply-real-gate/real_sample_fullply_verify.py 2>&1 \
            | tee formal-build-gate/evidence/sample-fullply.log

      - name: Prepare production Formal candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          "$APP_DIR/formal-build-gate/prepare-formal-runtime.sh" "$GITHUB_WORKSPACE/$APP_DIR"

      - name: Run Real Reflection Flow on exact Run30 hashes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR"
          rm -f real-reflection-flow-gate/REAL_REFLECTION_FLOW_RESULT.json
          python3 real-reflection-flow-gate/real_reflection_flow_verify.py 2>&1 \
            | tee formal-build-gate/evidence/reflection-flow.log

      - name: Run Real Cancel Re-analysis on exact Run30 hashes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR"
          rm -f real-cancel-reanalysis-gate/REAL_CANCEL_REANALYSIS_RESULT.json
          python3 real-cancel-reanalysis-gate/real_cancel_reanalysis_verify.py 2>&1 \
            | tee formal-build-gate/evidence/cancel-reanalysis.log

      - name: Evaluate Run30 Formal Build Profile candidate
        id: formal_candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR"
          python3 formal-build-gate/run30_formal_candidate_verify.py 2>&1 \
            | tee formal-build-gate/evidence/run30-formal-candidate.log

      - name: Build internal ZIP and verify basic extraction integrity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$APP_DIR/formal-build-gate/RUN30_FORMAL_BUILD_CANDIDATE_RESULT.json"
          test -s "$RESULT"
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path('Shogi-Reflection-Ver1.8.3/formal-build-gate/RUN30_FORMAL_BUILD_CANDIDATE_RESULT.json').read_text())
          if d.get('passed') is not True:
              print('Run30 candidate failed; skip internal ZIP creation.')
              sys.exit(20)
          PY
          INTERNAL="$RUNNER_TEMP/Shogi-Reflection-Ver1.8.3-RUN30-INTERNAL-FORMAL-CANDIDATE.zip"
          python3 - "$APP_DIR" "$INTERNAL" <<'PY'
          import sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1]); out=Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  if '__pycache__' in p.parts or p.suffix=='.pyc': continue
                  z.write(p, Path(root.name)/p.relative_to(root))
          PY
          sha256sum "$INTERNAL" | tee "$APP_DIR/formal-build-gate/evidence/internal-candidate-zip-sha256.txt"
          rm -rf "$RUNNER_TEMP/run30-postzip"
          mkdir -p "$RUNNER_TEMP/run30-postzip"
          unzip -q "$INTERNAL" -d "$RUNNER_TEMP/run30-postzip"
          POST="$RUNNER_TEMP/run30-postzip/$APP_DIR"

          # One legacy regression test also checks the repository-root diagnostic
          # workflow. A standalone app ZIP correctly contains its own identical
          # workflow copy under APP_DIR/.github. Mirror that extracted copy only
          # into the temporary parent test context; no external repository file is
          # injected and the ZIP content itself remains standalone.
          mkdir -p "$RUNNER_TEMP/run30-postzip/.github/workflows"
          cp "$POST/.github/workflows/build-yaneuraou-wasm.yml" \
            "$RUNNER_TEMP/run30-postzip/.github/workflows/build-yaneuraou-wasm.yml"
          cmp -s \
            "$POST/.github/workflows/build-yaneuraou-wasm.yml" \
            "$RUNNER_TEMP/run30-postzip/.github/workflows/build-yaneuraou-wasm.yml"
          sha256sum \
            "$POST/.github/workflows/build-yaneuraou-wasm.yml" \
            "$RUNNER_TEMP/run30-postzip/.github/workflows/build-yaneuraou-wasm.yml" \
            | tee "$GITHUB_WORKSPACE/$APP_DIR/formal-build-gate/evidence/postzip-repo-context-workflow-mirror-sha256.txt"

          cd "$POST"
          npm test 2>&1 | tee "$GITHUB_WORKSPACE/$APP_DIR/formal-build-gate/evidence/postzip-npm-test.log"
          node verify.mjs 2>&1 | tee "$GITHUB_WORKSPACE/$APP_DIR/formal-build-gate/evidence/postzip-static-verification.log"
          sha256sum \
            engine/yaneuraou/yaneuraou.material.js \
            engine/yaneuraou/yaneuraou.material.wasm \
            engine/yaneuraou/yaneuraou.material.worker.js \
            engine/yaneuraou/YaneuraOuWasmWorkerBootstrap.js \
            | tee "$GITHUB_WORKSPACE/$APP_DIR/formal-build-gate/evidence/postzip-runtime-sha256.txt"
          sha256sum \
            ENGINE_BUILD_METADATA.json \
            engine/yaneuraou/engine-manifest.json \
            | tee "$GITHUB_WORKSPACE/$APP_DIR/formal-build-gate/evidence/postzip-package-metadata-sha256.txt"
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          meta=json.loads(Path('ENGINE_BUILD_METADATA.json').read_text(encoding='utf-8'))
          man=json.loads(Path('engine/yaneuraou/engine-manifest.json').read_text(encoding='utf-8'))
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          expected={
            'jsSha256': sha('engine/yaneuraou/yaneuraou.material.js'),
            'wasmSha256': sha('engine/yaneuraou/yaneuraou.material.wasm'),
            'workerSha256': sha('engine/yaneuraou/yaneuraou.material.worker.js'),
            'workerBootstrapSha256': sha('engine/yaneuraou/YaneuraOuWasmWorkerBootstrap.js'),
          }
          for key,value in expected.items():
              assert meta.get(key)==value, (key,'metadata')
              assert man.get(key)==value, (key,'manifest')
          assert meta.get('measured') is True
          assert meta.get('diagnosticBuild') is False
          assert man.get('available') is True
          assert man.get('pthreadWorkerPackaging')=='SEPARATE_PTHREAD_WORKER'
          assert man.get('generatedPthreadWorkerCount')==1
          print('PASS: extracted package metadata/manifest match the extracted engine bytes.')
          PY
          rm -f "$INTERNAL"
          rm -rf "$RUNNER_TEMP/run30-postzip"

      - name: Upload Run30 evidence only
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: yaneuraou-run30-formal-build-profile-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            Shogi-Reflection-Ver1.8.3/formal-build-gate/
            Shogi-Reflection-Ver1.8.3/minimal-real-usi/MINIMAL_BUILD_METADATA.json
            Shogi-Reflection-Ver1.8.3/minimal-real-usi/MINIMAL_NODE_SEARCH_RESULT.json
            Shogi-Reflection-Ver1.8.3/minimal-real-usi/MINIMAL_BROWSER_SEARCH_RESULT.json
            Shogi-Reflection-Ver1.8.3/minimal-real-usi/MINIMAL_NODE_RUNTIME_RESULT.json
            Shogi-Reflection-Ver1.8.3/minimal-real-usi/MINIMAL_BROWSER_RUNTIME_RESULT.json
            Shogi-Reflection-Ver1.8.3/adapter-real-gate/REAL_ADAPTER_INTEGRATION_RESULT.json
            Shogi-Reflection-Ver1.8.3/sample-fullply-real-gate/REAL_SAMPLE_FULLPLY_RESULT.json
            Shogi-Reflection-Ver1.8.3/real-reflection-flow-gate/REAL_REFLECTION_FLOW_RESULT.json
            Shogi-Reflection-Ver1.8.3/real-cancel-reanalysis-gate/REAL_CANCEL_REANALYSIS_RESULT.json
            Shogi-Reflection-Ver1.8.3/engine/yaneuraou/engine-manifest.json

      - name: Enforce Run30 gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('Shogi-Reflection-Ver1.8.3/formal-build-gate/RUN30_FORMAL_BUILD_CANDIDATE_RESULT.json')
          if not p.exists():
              raise SystemExit('Run30 result missing')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('passed') is not True:
              raise SystemExit('Run30 Formal Build Profile failed: ' + ' | '.join(d.get('failures') or []))
          if d.get('diagnosticBuild') is not False:
              raise SystemExit('Run30 build is still diagnostic')
          print('PASS: fresh non-diagnostic YaneuraOu WASM passed every Real runtime/application gate.')
          print('PASS: Corresponding Source evidence was generated and exact runtime hashes were fixed.')
          print('PASS: internal candidate ZIP extracted and unchanged Automated/Static verification passed.')
          print('NOTE: Ver.1.8.3 is still NOT FINAL FORMAL in Run #30. Final ZIP naming/distribution package gate is next.')
          print('NOTE: Public/commercial distribution remains NOT READY; LEGAL REVIEW REQUIRED BEFORE PUBLIC DISTRIBUTION.')
          PY
