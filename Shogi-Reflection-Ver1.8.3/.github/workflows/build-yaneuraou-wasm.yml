name: Build pinned YaneuraOu WASM

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-yaneuraou-wasm.yml"
      - "scripts/build-yaneuraou-wasm.sh"
      - "scripts/package-yaneuraou-corresponding-source.sh"
      - "patches/yaneuraou-v9.00-wasm-usi-bridge.patch"
      - "scripts/hash-engine-assets.sh"
      - "scripts/update-engine-build-metadata.mjs"
      - "scripts/verify-yaneuraou-wasm.sh"
      - "YaneuraOuWasmWorkerBootstrap.js"
      - "YaneuraOuWasmBootstrapV182.test.js"
      - "YaneuraOuBuildBridgeV183.test.js"
      - "verify.mjs"
      - "real_yaneuraou_usi_verify.py"
      - "real_yaneuraou_browser_verify.py"
      - "requirements-real-engine.txt"
      - "ENGINE_BUILD_INCIDENT_004_RUNTIME_WASM_BASE_URL.md"
      - "ENGINE_BUILD_INCIDENT_005_OFFICIAL_WASM_TOOLCHAIN_ALIGNMENT.md"
      - "ENGINE_BUILD_INCIDENT_006_UPSTREAM_WASM_PACKAGER_OUTPUT_MISSING.md"
      - "ENGINE_BUILD_INCIDENT_007_V900_WASM_USI_EXPORT_DISABLED.md"
      - "ENGINE_BUILD_INCIDENT_008_REVIEWED_PATCH_DIFF_ABBREVIATION.md"
      - "ENGINE_BUILD_INCIDENT_011_FUNCTION_POINTER_SIGNATURE_MISMATCH.md"

permissions:
  contents: read

env:
  YANEURAOU_REPOSITORY: https://github.com/yaneurao/YaneuraOu.git
  YANEURAOU_COMMIT: a5ee2786c0030edc7d4a1cdfe94b04dffec55493
  YANEURAOU_VERSION: V9.00
  EMSDK_REPOSITORY: https://github.com/emscripten-core/emsdk.git
  EMSDK_REPOSITORY_COMMIT: e26beb67ef18a37d71d522d8b7096b20a4d3d0f9
  EMSDK_VERSION: 3.1.43
  EMSDK_DOCKER_IMAGE: emscripten/emsdk:3.1.43
  EXPECTED_EMSCRIPTEN_RELEASE_COMMIT: bf3c159888633d232c0507f4c76cc156a43c32dc
  MATERIAL_LEVEL: "1"
  YANEURAOU_FUNCTION_POINTER_DIAGNOSTIC: "1"

jobs:
  build:
    name: Reproducible MATERIAL WASM build
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Shogi Reflection
        uses: actions/checkout@v4.2.2

      - name: Prepare shell script permissions
        shell: bash
        run: |
          set -euo pipefail
          find scripts -maxdepth 1 -type f -name "*.sh" -print -exec chmod +x {} \;
          ls -l scripts/*.sh

      - name: Record CI checkout baseline presence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-record
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const baseline = JSON.parse(fs.readFileSync('SOURCE_OF_TRUTH_V1_8_INTEGRATION_CANDIDATE_HASHES.json','utf8'));
          const missing = Object.keys(baseline.files).filter(file => !fs.existsSync(path.join(process.cwd(), file)));
          const lines = [
            'Shogi Reflection Ver.1.8.3 CI Checkout Baseline Presence Audit',
            `baseline_files=${Object.keys(baseline.files).length}`,
            `missing_before_build=${missing.length}`,
            ...missing.map(file => `MISSING | ${file}`),
          ];
          fs.writeFileSync('build-record/ci-checkout-baseline-audit.txt', lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

      - name: Record runner environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-record
          {
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-UNKNOWN}"
            echo "image_version=${ImageVersion:-UNKNOWN}"
            echo "uname=$(uname -a)"
            echo "--- /etc/os-release ---"
            cat /etc/os-release
          } | tee build-record/runner-environment.txt
          node --version | tee build-record/host-node-version.txt
          python3 --version | tee build-record/host-python-version.txt

      - name: Verify pinned Emscripten mapping and Docker toolchain availability
        shell: bash
        run: |
          set -euo pipefail
          EMSDK_DIR="$RUNNER_TEMP/emsdk"
          git clone --filter=blob:none "$EMSDK_REPOSITORY" "$EMSDK_DIR"
          git -C "$EMSDK_DIR" checkout --detach "$EMSDK_REPOSITORY_COMMIT"
          ACTUAL_EMSDK_REPO_COMMIT="$(git -C "$EMSDK_DIR" rev-parse HEAD)"
          test "$ACTUAL_EMSDK_REPO_COMMIT" = "$EMSDK_REPOSITORY_COMMIT"
          printf '%s\n' "$ACTUAL_EMSDK_REPO_COMMIT" | tee build-record/emsdk-repository-commit.txt
          python3 - "$EMSDK_DIR/emscripten-releases-tags.json" <<'PYMAP'
          import json, os, sys
          p=sys.argv[1]
          data=json.load(open(p, encoding='utf-8'))
          version=os.environ['EMSDK_VERSION']
          expected=os.environ['EXPECTED_EMSCRIPTEN_RELEASE_COMMIT']
          actual=data['releases'].get(version)
          print(f"emsdkVersion={version}")
          print(f"expectedEmscriptenReleaseCommit={expected}")
          print(f"actualEmscriptenReleaseCommit={actual}")
          if actual != expected:
              raise SystemExit(f"Emscripten release mapping mismatch: {actual} != {expected}")
          PYMAP
          docker --version | tee build-record/docker-version.txt
          echo "EMSDK_DIR=$EMSDK_DIR" >> "$GITHUB_ENV"

      - name: Clone and verify pinned YaneuraOu source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/YaneuraOu"
          git clone "$YANEURAOU_REPOSITORY" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$YANEURAOU_COMMIT"
          ACTUAL_COMMIT="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$YANEURAOU_COMMIT"
          git -C "$SOURCE_DIR" status --porcelain=v1 | tee build-record/yaneuraou-source-status.txt
          test ! -s build-record/yaneuraou-source-status.txt
          printf '%s\n' "$ACTUAL_COMMIT" | tee build-record/yaneuraou-source-commit.txt
          echo "YANEURAOU_SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Build pinned-source MATERIAL WASM with documented WASM USI bridge
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-yaneuraou-wasm.sh "$YANEURAOU_SOURCE_DIR" "$GITHUB_WORKSPACE/engine/yaneuraou" "$GITHUB_WORKSPACE/build-record"

      - name: Package corresponding-source evidence
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/package-yaneuraou-corresponding-source.sh "$YANEURAOU_SOURCE_DIR" "$PWD/corresponding-source" "$PWD/build-record"
          if [ -f "$EMSDK_DIR/LICENSE" ]; then cp "$EMSDK_DIR/LICENSE" corresponding-source/emsdk-LICENSE; fi
          docker run --rm "$EMSDK_DOCKER_IMAGE" sh -lc 'test -f /emsdk/upstream/emscripten/LICENSE && cat /emsdk/upstream/emscripten/LICENSE' > corresponding-source/Emscripten-LICENSE
          test -s corresponding-source/Emscripten-LICENSE
          printf '%s\n' "$(cat build-record/emscripten-docker-image-digest.txt)" > corresponding-source/Emscripten-Docker-Image-Digest.txt

      - name: Verify diagnostic artifact integrity, hashes and automated tests
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/verify-yaneuraou-diagnostic-wasm.sh
          node scripts/update-engine-license-gate.mjs --built

      - name: Record expected Formal artifact-gate rejection for diagnostic build
        id: formal_artifact_gate
        continue-on-error: true
        shell: bash
        run: bash ./scripts/verify-yaneuraou-wasm.sh

      - name: Run static verification and preserve diagnostics
        id: static_verification
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check
          code=$?
          set -e
          printf 'static_verification_exit_code=%s\n' "$code" | tee build-record/static-verification-exit.txt
          exit "$code"

      - name: Install pinned Real Engine browser verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r requirements-real-engine.txt
          python3 -m playwright install --with-deps chromium

      - name: Run existing browser, visual and fallback regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 browser_verify.py
          python3 visual_verify.py
          python3 real_engine_browser_verify.py

      - name: Run diagnostic Real YaneuraOu USI verification with assertion capture
        id: real_usi
        continue-on-error: true
        shell: bash
        env:
          YANEURAOU_ALLOW_DIAGNOSTIC_ARTIFACT: "1"
        run: python3 real_yaneuraou_usi_verify.py

      - name: Keep Real application E2E fail-closed during diagnostic build
        shell: bash
        run: |
          set -euo pipefail
          echo "Run #13 is diagnostic-only; Real application E2E is intentionally deferred until a production build fixes the runtime mismatch."

      - name: Evaluate pre-ZIP Formal Completion Gate (diagnostic)
        id: formal_gate
        continue-on-error: true
        shell: bash
        run: node scripts/formal-completion-gate.mjs

      - name: Upload Build Bridge artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: yaneuraou-v9.00-material1-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            engine/yaneuraou/
            YaneuraOuWasmWorkerBootstrap.js
            ENGINE_BUILD_METADATA.json
            ENGINE_BUILD_RESULT.txt
            ENGINE_ASSET_SHA256SUMS.txt
            REAL_YANEURAOU_ARTIFACT_GATE_RESULT.json
            REAL_YANEURAOU_USI_RESULT.json
            REAL_YANEURAOU_E2E_RESULT.json
            ENGINE_REAL_USI_RESULT.txt
            ENGINE_REAL_E2E_RESULT.txt
            REAL_YANEURAOU_BROWSER_E2E_RESULT.txt
            ENGINE_REAL_PERFORMANCE_RESULT.json
            FORMAL_COMPLETION_GATE_RESULT.json
            ENGINE_LICENSE_GATE_RESULT.json
            STATIC_VERIFICATION_RESULT.txt
            SYNTAX_CHECK_RESULT.txt
            TEST_RESULT.txt
            BROWSER_VERIFICATION_RESULT.txt
            VISUAL_VERIFICATION_RESULT.txt
            REAL_ENGINE_BROWSER_VERIFICATION_RESULT.txt
            build-record/
            corresponding-source/
            scripts/build-yaneuraou-wasm.sh
            scripts/package-yaneuraou-corresponding-source.sh
            patches/yaneuraou-v9.00-wasm-usi-bridge.patch
            scripts/hash-engine-assets.sh
            scripts/update-engine-build-metadata.mjs
            scripts/verify-yaneuraou-wasm.sh
            scripts/update-engine-license-gate.mjs
            scripts/run-node-tests-with-evidence.sh
            real_yaneuraou_usi_verify.py
            real_yaneuraou_browser_verify.py
            requirements-real-engine.txt
            ENGINE_BUILD_REPRODUCIBILITY.md
            ENGINE_BUILD_INCIDENT_006_UPSTREAM_WASM_PACKAGER_OUTPUT_MISSING.md
            ENGINE_BUILD_INCIDENT_007_V900_WASM_USI_EXPORT_DISABLED.md
            ENGINE_BUILD_INCIDENT_008_REVIEWED_PATCH_DIFF_ABBREVIATION.md
            YANEURAOU_WASM_BUILD_BRIDGE.md
            ENGINE_BUILD_INCIDENT_002_PTHREAD_WORKER_PACKAGING.md
            ENGINE_BUILD_INCIDENT_005_OFFICIAL_WASM_TOOLCHAIN_ALIGNMENT.md
            ENGINE_SOURCE_DISTRIBUTION_PLAN.md
            ENGINE_LICENSE_AUDIT.md
            THIRD_PARTY_NOTICES.md

      - name: Enforce diagnostic evidence production after upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          failures = []
          result_path = Path("REAL_YANEURAOU_USI_RESULT.json")
          if not result_path.exists():
              failures.append("Diagnostic Real USI evidence missing")
          else:
              data = json.loads(result_path.read_text(encoding="utf-8"))
              status = data.get("status")
              if status == "NOT_RUN_REAL_WASM_ASSET_UNAVAILABLE":
                  failures.append("Diagnostic Real USI did not run")
              obs = data.get("observations") or {}
              if obs.get("diagnosticBuild") is not True:
                  failures.append("Diagnostic Real USI result is not bound to diagnosticBuild=true")
              if obs.get("diagnosticArtifactExplicitlyAllowed") is not True:
                  failures.append("Diagnostic Real USI explicit opt-in evidence missing")

          formal_artifact = Path("REAL_YANEURAOU_ARTIFACT_GATE_RESULT.json")
          if formal_artifact.exists():
              gate = json.loads(formal_artifact.read_text(encoding="utf-8"))
              if gate.get("passed") is True:
                  failures.append("Formal artifact gate must reject diagnostic builds")

          if failures:
              raise SystemExit("Run #13 diagnostic evidence failure(s): " + " | ".join(failures))

          print("Run #13 diagnostic evidence was produced. This is NOT Formal Completion.")
          PY
