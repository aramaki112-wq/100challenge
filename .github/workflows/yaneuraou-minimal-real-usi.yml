name: YaneuraOu Minimal Real USI Harness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yaneuraou-minimal-real-usi.yml"
      - "Shogi-Reflection-Ver1.8.3/minimal-real-usi/**"

permissions:
  contents: read

env:
  APP_DIR: Shogi-Reflection-Ver1.8.3
  YANEURAOU_REPOSITORY: https://github.com/yaneurao/YaneuraOu.git
  YANEURAOU_COMMIT: a5ee2786c0030edc7d4a1cdfe94b04dffec55493
  EMSCRIPTEN_IMAGE: emscripten/emsdk:3.1.43

jobs:
  minimal-real-usi:
    name: Minimal usi to usiok
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout Shogi Reflection
        uses: actions/checkout@v4.2.2

      - name: Prepare minimal harness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$APP_DIR/minimal-real-usi/build-minimal-usi.sh"
          mkdir -p "$APP_DIR/minimal-real-usi/evidence"
          bash -n "$APP_DIR/minimal-real-usi/build-minimal-usi.sh"
          node --check "$APP_DIR/minimal-real-usi/minimal_node_usi_probe.js"
          python3 -m py_compile "$APP_DIR/minimal-real-usi/minimal_browser_usi_probe.py"

      - name: Pull and record pinned Emscripten image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$EMSCRIPTEN_IMAGE"
          docker image inspect "$EMSCRIPTEN_IMAGE" --format '{{.Id}}' \
            | tee "$APP_DIR/minimal-real-usi/evidence/emscripten-image-id.txt"
          docker image inspect "$EMSCRIPTEN_IMAGE" --format '{{json .RepoDigests}}' \
            | tee "$APP_DIR/minimal-real-usi/evidence/emscripten-image-repodigests.json"

      - name: Clone and verify pinned YaneuraOu
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/YaneuraOu-minimal"
          git clone "$YANEURAOU_REPOSITORY" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$YANEURAOU_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$YANEURAOU_COMMIT"
          git -C "$SOURCE_DIR" status --porcelain=v1 \
            | tee "$APP_DIR/minimal-real-usi/evidence/upstream-status-before-patch.txt"
          test ! -s "$APP_DIR/minimal-real-usi/evidence/upstream-status-before-patch.txt"
          echo "YANEURAOU_MINIMAL_SOURCE=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Build minimal candidate WASM
        shell: bash
        run: |
          set -euo pipefail
          "$APP_DIR/minimal-real-usi/build-minimal-usi.sh" \
            "$YANEURAOU_MINIMAL_SOURCE" \
            "$GITHUB_WORKSPACE/$APP_DIR"

      - name: Run minimal Node USI probe
        id: node_probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR/minimal-real-usi"
          node minimal_node_usi_probe.js 2>&1 | tee evidence/node-probe.log

      - name: Install minimal browser verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r "$APP_DIR/requirements-real-engine.txt"
          python3 -m playwright install --with-deps chromium

      - name: Run minimal Browser USI probe
        id: browser_probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR/minimal-real-usi"
          python3 minimal_browser_usi_probe.py 2>&1 | tee evidence/browser-probe.log

      - name: Upload minimal harness evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: yaneuraou-minimal-real-usi-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            Shogi-Reflection-Ver1.8.3/minimal-real-usi/

      - name: Enforce only the minimal usiok gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('Shogi-Reflection-Ver1.8.3/minimal-real-usi')
          failures=[]
          for filename,label in [
              ('MINIMAL_NODE_USI_RESULT.json','Node minimal USI'),
              ('MINIMAL_BROWSER_USI_RESULT.json','Browser minimal USI'),
          ]:
              p=root/filename
              if not p.exists():
                  failures.append(f'{label}: result missing')
                  continue
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('usiok') is not True:
                  failures.append(f"{label}: {d.get('status','failed')}")
          if failures:
              raise SystemExit('Minimal usiok gate failure(s): ' + ' | '.join(failures))
          print('PASS: both Node and Browser minimal harnesses observed usiok.')
          print('NOTE: this is not Formal Completion and does not run the Shogi Reflection full E2E.')
          PY
