name: YaneuraOu Minimal Real Search Harness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yaneuraou-minimal-real-usi.yml"
      - "Shogi-Reflection-Ver1.8.3/minimal-real-usi/**"

permissions:
  contents: read

env:
  APP_DIR: Shogi-Reflection-Ver1.8.3
  YANEURAOU_REPOSITORY: https://github.com/yaneurao/YaneuraOu.git
  YANEURAOU_COMMIT: a5ee2786c0030edc7d4a1cdfe94b04dffec55493
  EMSCRIPTEN_IMAGE: emscripten/emsdk:3.1.43

jobs:
  minimal-real-search:
    name: Minimal position to bestmove
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout Shogi Reflection
        uses: actions/checkout@v4.2.2

      - name: Prepare minimal search harness
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$APP_DIR/minimal-real-usi/build-minimal-usi.sh"
          mkdir -p "$APP_DIR/minimal-real-usi/evidence"
          bash -n "$APP_DIR/minimal-real-usi/build-minimal-usi.sh"
          node --check "$APP_DIR/minimal-real-usi/minimal_node_search_probe.cjs"
          python3 -m py_compile "$APP_DIR/minimal-real-usi/minimal_browser_search_probe.py"

      - name: Pull and record pinned Emscripten image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$EMSCRIPTEN_IMAGE"
          docker image inspect "$EMSCRIPTEN_IMAGE" --format '{{.Id}}' \
            | tee "$APP_DIR/minimal-real-usi/evidence/emscripten-image-id.txt"
          docker image inspect "$EMSCRIPTEN_IMAGE" --format '{{json .RepoDigests}}' \
            | tee "$APP_DIR/minimal-real-usi/evidence/emscripten-image-repodigests.json"

      - name: Clone and verify pinned YaneuraOu
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/YaneuraOu-minimal"
          git clone "$YANEURAOU_REPOSITORY" "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$YANEURAOU_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$YANEURAOU_COMMIT"
          git -C "$SOURCE_DIR" status --porcelain=v1 \
            | tee "$APP_DIR/minimal-real-usi/evidence/upstream-status-before-patch.txt"
          test ! -s "$APP_DIR/minimal-real-usi/evidence/upstream-status-before-patch.txt"
          echo "YANEURAOU_MINIMAL_SOURCE=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Build minimal candidate WASM
        shell: bash
        run: |
          set -euo pipefail
          "$APP_DIR/minimal-real-usi/build-minimal-usi.sh" \
            "$YANEURAOU_MINIMAL_SOURCE" \
            "$GITHUB_WORKSPACE/$APP_DIR"

      - name: Run minimal Node search probe
        id: node_search_probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR/minimal-real-usi"
          node minimal_node_search_probe.cjs 2>&1 | tee evidence/node-search-probe.log

      - name: Install minimal browser verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r "$APP_DIR/requirements-real-engine.txt"
          python3 -m playwright install --with-deps chromium

      - name: Run minimal Browser search probe
        id: browser_search_probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$APP_DIR/minimal-real-usi"
          python3 minimal_browser_search_probe.py 2>&1 | tee evidence/browser-search-probe.log

      - name: Upload minimal search evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: yaneuraou-minimal-real-search-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            Shogi-Reflection-Ver1.8.3/minimal-real-usi/

      - name: Enforce minimal search gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('Shogi-Reflection-Ver1.8.3/minimal-real-usi')
          failures=[]
          required=[
              ('usiok', True),
              ('readyok', True),
              ('searchStarted', True),
              ('scoreObserved', True),
              ('depthObserved', True),
              ('nodesObserved', True),
              ('timeObserved', True),
              ('pvObserved', True),
              ('bestmoveObserved', True),
          ]
          for filename,label in [
              ('MINIMAL_NODE_SEARCH_RESULT.json','Node minimal search'),
              ('MINIMAL_BROWSER_SEARCH_RESULT.json','Browser minimal search'),
          ]:
              p=root/filename
              if not p.exists():
                  failures.append(f'{label}: result missing')
                  continue
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('passed') is not True:
                  failures.append(f"{label}: {d.get('status','failed')}")
                  continue
              missing=[key for key,value in required if d.get(key) is not value]
              if missing:
                  failures.append(f"{label}: missing evidence {','.join(missing)}")
              if not d.get('bestmove'):
                  failures.append(f'{label}: bestmove missing')
              if d.get('infoCount',0) < 1:
                  failures.append(f'{label}: no info line')
          if failures:
              raise SystemExit('Minimal search gate failure(s): ' + ' | '.join(failures))
          print('PASS: Node and Browser both completed position startpos -> go nodes 5000 -> info -> bestmove.')
          print('PASS: score/depth/nodes/time/PV evidence was observed in both minimal harnesses.')
          print('NOTE: this remains NOT FORMAL and does not run the Shogi Reflection full application E2E.')
          PY
